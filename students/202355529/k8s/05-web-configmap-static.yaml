# 자동 생성 파일: scripts/gen_configmaps.py 로 다시 만든다. 직접 수정하지 말 것.
# 게임 화면 정적 파일
apiVersion: v1
kind: ConfigMap
metadata:
  name: tia-web-static
  labels:
    app.kubernetes.io/name: tia-web
    app.kubernetes.io/part-of: tia-roadmap
data:
  index.html: |
    <!doctype html>
    <html lang="ko">
    <head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <title>Tia's Roadmap</title>
      <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
      <link rel="stylesheet" href="style.css">
      <!-- 동작 줄이기 설정이 아닐 때만 등장 효과를 켠다 (그리기 전에 붙여야 깜빡이지 않음) -->
      <script>if (!matchMedia("(prefers-reduced-motion: reduce)").matches) document.documentElement.classList.add("motion");</script>
    </head>
    <body>
      <canvas class="trail" id="trail" aria-hidden="true"></canvas>
      <header class="topbar">
        <span class="brand">Tia's Roadmap</span>
        <button class="link" id="skipBtn" type="button">포트폴리오 바로 보기 →</button>
      </header>

      <!-- 1. 인트로: 공연 티켓 (--d: 등장 지연) -->
      <section class="screen active" id="intro">
        <div class="ticket-wrap">
          <div class="ticket" id="ticket">
            <div class="ticket-main">
              <svg class="t-stamp" viewBox="0 0 100 100" aria-hidden="true">
                <defs><path id="ring" d="M50,50 m-38,0 a38,38 0 1,1 76,0 a38,38 0 1,1 -76,0"/></defs>
                <g class="spin"><text><textPath href="#ring" textLength="236">REHEARSAL STAGE · 5 6 7 8 ·</textPath></text></g>
                <circle class="dot" cx="50" cy="50" r="4"/>
              </svg>
              <p class="t-eyebrow" data-reveal style="--d:250ms">Rehearsal Tour · 2023 — 2026</p>
              <h1 class="t-title" data-reveal="write" style="--d:380ms">Tia's<br><span class="outline">Roadmap</span></h1>
              <p class="t-count" data-reveal style="--d:700ms">five, six, seven, eight —</p>
              <ol class="t-setlist" id="ticketSetlist">
                <li data-reveal style="--d:820ms"><span class="n">01</span><span class="y">2023</span><span class="ti">연습생<small>Trainee</small></span><span class="bpm"><i style="--beat:.652s"></i><b>92</b> BPM</span></li>
                <li data-reveal style="--d:900ms"><span class="n">02</span><span class="y">2024</span><span class="ti">데뷔<small>Debut</small></span><span class="bpm"><i style="--beat:.577s"></i><b>104</b> BPM</span></li>
                <li data-reveal style="--d:980ms"><span class="n">03</span><span class="y">2025</span><span class="ti">메인 스테이지<small>Main Stage</small></span><span class="bpm"><i style="--beat:.517s"></i><b>116</b> BPM</span></li>
                <li data-reveal style="--d:1060ms"><span class="n">04</span><span class="y">2026</span><span class="ti">앵콜<small>Encore</small></span><span class="bpm"><i style="--beat:.469s"></i><b>128</b> BPM</span></li>
              </ol>
              <dl class="t-meta" data-reveal style="--d:1180ms">
                <div><dt>Venue</dt><dd>OpenShift Sandbox</dd></div>
                <div><dt>Doors</dt><dd>:8080</dd></div>
                <div><dt>Keys</dt><dd>← ↓ ↑ →</dd></div>
              </dl>
            </div>
            <div class="ticket-stub">
              <div class="s-admit" data-reveal style="--d:520ms">Admit<br>One</div>
              <dl class="s-info" data-reveal style="--d:640ms">
                <div><dt>No.</dt><dd>202355529</dd></div>
                <div><dt>Seat</dt><dd>tia-web</dd></div>
                <div><dt>Show</dt><dd>10.30 10:00</dd></div>
              </dl>
              <div class="s-barcode" aria-hidden="true" data-reveal style="--d:760ms"></div>
            </div>
          </div>
        </div>
        <div class="t-actions" data-reveal style="--d:1300ms">
          <button class="primary" id="startBtn" type="button">입장하기 <span class="arr">→</span></button>
          <p class="t-hint">D F J K도 돼요 · 정확도 60% 넘으면 무대 클리어</p>
        </div>
        <p class="note" id="introNote"></p>
      </section>

      <!-- 2. 스테이지 선택 -->
      <section class="screen" id="select">
        <p class="t-eyebrow" data-reveal>Setlist · Tonight</p>
        <h2 class="big-title" data-reveal="write" style="--d:80ms">Tonight's <span class="outline">Setlist</span></h2>
        <p class="sub" data-reveal style="--d:200ms">앞 무대를 클리어하면 다음 무대가 열려요.</p>
        <ol class="setlist" id="setlist"></ol>
      </section>

      <!-- 3. 플레이 -->
      <section class="screen" id="play">
        <div class="hud">
          <div><span class="eyebrow" id="hudStage">Stage</span><strong id="hudTitle"></strong></div>
          <div class="hud-right"><span id="hudScore">0</span><span class="muted" id="hudCombo"></span></div>
        </div>
        <div class="stage-wrap">
          <!-- 댄서: 무대 BPM에 맞춰 포즈가 바뀌고, 판정에 따라 점프·휘청 -->
          <div class="dancer" id="dancer" aria-hidden="true">
            <div class="d-fig">
              <svg class="d-body" viewBox="0 0 120 170">
                <g class="leg leg-l"><line x1="53" y1="104" x2="50" y2="152"/><ellipse cx="47" cy="155" rx="9" ry="4.5"/></g>
                <g class="leg leg-r"><line x1="67" y1="104" x2="70" y2="152"/><ellipse cx="73" cy="155" rx="9" ry="4.5"/></g>
                <path class="torso" d="M41 54 Q60 46 79 54 L77 108 Q60 112 43 108 Z"/>
                <path class="turtle" d="M52 47 h16 v6 Q60 56 52 53 Z M55 56 L60 104 L65 56 Q60 60 55 56 Z"/>
                <g class="arm arm-l"><line x1="40" y1="58" x2="38" y2="82"/>
                  <g class="fore fore-l"><line x1="38" y1="82" x2="37" y2="104"/><circle cx="37" cy="107" r="5"/></g></g>
                <g class="arm arm-r"><line x1="80" y1="58" x2="82" y2="82"/>
                  <g class="fore fore-r"><line x1="82" y1="82" x2="83" y2="104"/><circle cx="83" cy="107" r="5"/></g></g>
              </svg>
              <img class="d-face" alt="" src="data:image/jpeg;base64,">
            </div>
            <span class="d-pop" id="dancerPop"></span>
            <div class="d-shadow"></div>
          </div>
          <canvas id="canvas" width="360" height="520"></canvas>
          <div class="countdown" id="countdown"></div>
        </div>
        <div class="pads" id="pads">
          <button type="button" data-lane="0">←</button>
          <button type="button" data-lane="1">↓</button>
          <button type="button" data-lane="2">↑</button>
          <button type="button" data-lane="3">→</button>
        </div>
      </section>

      <!-- 4. 결과 + 챕터 공개 -->
      <section class="screen" id="result">
        <div class="result-card" id="resultCard">
          <span class="clear-stamp" aria-hidden="true">Clear</span>
          <p class="t-eyebrow" id="resultEyebrow" data-reveal></p>
          <h2 class="big-title" id="resultTitle" data-reveal="write" style="--d:100ms"></h2>
          <dl class="stats" id="resultStats" data-reveal style="--d:260ms"></dl>
        </div>
        <article class="chapter" id="chapter"></article>
        <div class="actions" id="resultActions" data-reveal style="--d:500ms"></div>
      </section>

      <!-- 5. 커튼콜 (커튼이 열리는 동안 내용이 떠오르도록 지연을 길게 준다) -->
      <section class="screen" id="curtain">
        <p class="t-eyebrow" data-reveal style="--d:600ms">Curtain Call · Thank you</p>
        <h2 class="cc-headline" id="ownerHeadline" data-reveal="write" style="--d:700ms"></h2>
        <p class="lead" id="ownerAbout" data-reveal style="--d:850ms"></p>
        <p class="links" id="ownerLinks" data-reveal style="--d:950ms"></p>
        <dl class="facts" id="ownerFacts" data-reveal style="--d:1050ms"></dl>

        <h3 class="sec-title" data-reveal style="--d:1150ms"><span class="outline">Spot</span>light</h3>
        <div class="spotlight" id="spotlight"></div>

        <h3 class="sec-title" data-reveal>The <span class="outline">Program</span></h3>
        <div class="timeline" id="timeline"></div>

        <h3 class="sec-title" data-reveal>Next <span class="outline">Tour</span></h3>
        <ol class="roadmap" id="roadmap" data-reveal></ol>
        <p class="roadmap-note" data-reveal>To be continued —</p>

        <h3 class="sec-title" data-reveal>Curtain Call <span class="outline">Board</span></h3>
        <div class="board" data-reveal>
          <section>
            <h3>리더보드</h3>
            <form id="scoreForm" class="inline-form">
              <span class="muted" id="myScore"></span>
              <input id="scoreName" maxlength="12" placeholder="이름" required>
              <button type="submit">기록 남기기</button>
            </form>
            <ol class="ranking" id="ranking"></ol>
          </section>
          <section>
            <h3>응원 한마디</h3>
            <form id="cheerForm" class="stack-form">
              <input id="cheerName" maxlength="12" placeholder="이름 (선택)">
              <textarea id="cheerMsg" maxlength="80" rows="2" placeholder="80자 이내로 남겨주세요" required></textarea>
              <button type="submit">응원 남기기</button>
            </form>
            <ul class="cheers" id="cheers"></ul>
          </section>
        </div>
        <p class="note" id="dbNote"></p>
        <div class="actions"><button class="ghost" type="button" id="replayBtn">처음부터 다시 공연하기</button></div>
      </section>

      <footer class="foot"><span id="podInfo"></span></footer>
      <!-- 커튼콜 전환용 막 -->
      <div class="curtains" id="curtains" aria-hidden="true">
        <div class="c-left"></div><div class="c-right"></div>
        <span class="c-label">Curtain Call</span>
      </div>
      <script src="game.js"></script>
    </body>
    </html>
  game.js: |
    /* Tia's Roadmap — Rehearsal Stage
     * 4레인 리듬 게임. 각 무대(학년)를 클리어하면 그 해의 기록이 열린다.
     * 음원 파일 없이 Web Audio로 메트로놈 비트를 직접 만든다.
     */
    (() => {
      "use strict";

      const $ = (id) => document.getElementById(id);
      const LANES = 4;
      const KEYMAP = {
        ArrowLeft: 0, ArrowDown: 1, ArrowUp: 2, ArrowRight: 3,
        KeyD: 0, KeyF: 1, KeyJ: 2, KeyK: 3,
      };
      const ROTATION = [-Math.PI / 2, Math.PI, 0, Math.PI / 2]; // ← ↓ ↑ →
      const WINDOW = { perfect: 0.07, good: 0.14, miss: 0.18 };
      const CLEAR_ACCURACY = 0.6;
      const BEATS = 32;
      const LEAD_IN = 4;
      // 무대가 진행될수록 촘촘해진다: [박자당 스텝 수, 노트 확률, 동시치기 확률]
      const DIFFICULTY = [[1, 0.6, 0], [1, 0.85, 0], [2, 0.5, 0.05], [2, 0.55, 0.05]];

      const C = { paper: "#fbf8f2", ink: "#2b2a27", line: "#e2dccf", matcha: "#7f9c7a", pink: "#d6a2a0", muted: "#8a857b" };

      const state = {
        portfolio: null,
        cleared: new Set(),
        best: {},          // stageIndex -> best score
        current: null,     // 진행 중인 무대
      };

      // ------------------------------------------------------------ storage (선택적 편의 기능)
      function loadProgress() {
        try {
          const saved = JSON.parse(localStorage.getItem("tia-progress") || "{}");
          (saved.cleared || []).forEach((i) => state.cleared.add(i));
          state.best = saved.best || {};
        } catch (_) { /* 저장소를 못 써도 게임은 동작 */ }
      }
      function saveProgress() {
        try {
          localStorage.setItem("tia-progress", JSON.stringify({ cleared: [...state.cleared], best: state.best }));
        } catch (_) { /* ignore */ }
      }
      const totalScore = () => Object.values(state.best).reduce((a, b) => a + b, 0);

      // ------------------------------------------------------------ screens
      function show(id) {
        document.querySelectorAll(".screen").forEach((s) => s.classList.toggle("active", s.id === id));
        $("skipBtn").hidden = id === "curtain"; // 이미 포트폴리오를 보고 있으니 숨긴다
        window.scrollTo({ top: 0 });
      }

      function esc(s) {
        return String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
      }

      // d0부터 step 간격으로 한 줄씩 떠오르게 하는 data-reveal 속성
      const rv = (ms) => `data-reveal style="--d:${ms}ms"`;

      // metric은 있는 항목에만 붙인다
      const metricHTML = (it) => (it.metric ? `<em class="metric">${esc(it.metric)}</em>` : "");

      // detail이 있는 항목은 눌러서 말풍선을 펼칠 수 있게 한다
      const detailAttrs = (it, cls = "") => {
        const c = `${cls}${it.detail ? " has-detail" : ""}`.trim();
        const attrs = it.detail ? ` tabindex="0" role="button" aria-expanded="false" data-title="${esc(it.title)}"` : "";
        return `${c ? `class="${c}"` : ""}${attrs}`;
      };
      const plusHTML = (it) => (it.detail ? `<i class="plus" aria-hidden="true">+</i>` : "");
      const bubbleHTML = (it) => (it.detail ? `<div class="bubble"><div><div class="bubble-text">${esc(it.detail)}</div></div></div>` : "");

      // 커튼콜 프로그램북 목록: 태그 | 제목·설명 | 수치
      function itemsHTML(stage, d0) {
        return stage.items.map((it, k) =>
          `<li ${rv(d0 + k * 70)} ${detailAttrs(it)}><span class="tag ${esc(it.tag)}">${esc(it.tag)}</span>
            <span>${it.title ? `<b>${esc(it.title)}${plusHTML(it)}</b>` : ""}${esc(it.text)}</span>${metricHTML(it)}${bubbleHTML(it)}</li>`).join("");
      }

      // 클리어 화면: 항목마다 칩 카드 한 장
      function chipsHTML(stage, d0) {
        return stage.items.map((it, k) =>
          `<li ${rv(d0 + k * 60)} ${detailAttrs(it, "chip")}><span class="tag ${esc(it.tag)}">${esc(it.tag)}</span>
            ${it.title ? `<strong>${esc(it.title)}${plusHTML(it)}</strong>` : ""}<span class="chip-text">${esc(it.text)}</span>${metricHTML(it)}${bubbleHTML(it)}</li>`).join("");
      }

      // Spotlight 카드: 누르면 프로그램북의 해당 항목으로 내려가 말풍선을 연다
      function spotlightHTML(p, d0) {
        return (p.spotlight || []).map((s, k) => {
          const stage = p.stages.find((st) => st.year === s.year);
          const item = stage && stage.items.find((it) => it.title === s.ref);
          return `<div ${rv(d0 + k * 100)}><button type="button" class="spot" data-ref="${esc(s.ref)}">
            <span class="spot-year">${esc(s.year)}${item ? ` · ${esc(item.tag)}` : ""}</span>
            <span class="spot-value">${esc(s.value)}</span><span class="spot-label">${esc(s.label)}</span>
            <strong>${esc(s.ref)}</strong><span class="spot-text">${esc(s.text)}</span>
            <span class="spot-more">자세히 <span class="arr">↓</span></span></button></div>`;
        }).join("");
      }

      function chapterHTML(stage, d0 = 0) {
        const hl = stage.highlight
          ? `<div class="hl"><span class="hl-value">${esc(stage.highlight.value)}</span><span class="hl-label">${esc(stage.highlight.label)}</span></div>`
          : "";
        return `<div class="ch-head" ${rv(d0)}><h3>${esc(stage.year)} · ${esc(stage.title)}</h3><span class="muted">${esc(stage.grade)}</span></div>
          <div class="ch-hl" ${rv(d0 + 80)}>${hl}<p>${esc(stage.summary)}</p></div>
          <ul class="chips">${chipsHTML(stage, d0 + 180)}</ul>`;
      }

      // 커튼콜 프로그램북의 한 페이지: 왼쪽에 연도·하이라이트, 오른쪽에 그 해의 기록
      function programHTML(stage, d0) {
        const hl = stage.highlight
          ? `<span class="p-hl">${esc(stage.highlight.value)}<small>${esc(stage.highlight.label)}</small></span>` : "";
        return `<article class="program">
          <div ${rv(d0)}><span class="p-year">${esc(stage.year)}</span><span class="p-grade">${esc(stage.grade)}</span>${hl}</div>
          <div><h4 ${rv(d0 + 60)}>${esc(stage.title)}<small>${esc(stage.subtitle)}</small></h4>
            <p ${rv(d0 + 120)}>${esc(stage.summary)}</p><ul class="items">${itemsHTML(stage, d0 + 180)}</ul></div>
        </article>`;
      }

      function renderSetlist() {
        if (!state.portfolio) return;
        const list = $("setlist");
        list.innerHTML = "";
        const row = (i, cls, no, body, bpm, stateHTML, disabled, onClick) => {
          // 등장 효과(transform)는 li가, 호버 효과는 button이 맡아 서로 덮어쓰지 않게 한다
          const li = document.createElement("li");
          li.dataset.reveal = "";
          li.style.setProperty("--d", `${260 + i * 80}ms`);
          li.innerHTML = `<button type="button" class="set-row ${cls}" ${disabled ? "disabled" : ""}>
              <span class="set-no">${no}</span><span class="set-body">${body}</span>${bpm}
              <span class="set-state">${stateHTML}</span></button>`;
          li.querySelector("button").addEventListener("click", onClick);
          list.appendChild(li);
        };
        state.portfolio.stages.forEach((st, i) => {
          const unlocked = i === 0 || state.cleared.has(i - 1);
          const cleared = state.cleared.has(i);
          row(i, "", String(i + 1).padStart(2, "0"),
            `<span class="set-year">${st.year} · ${esc(st.grade)}</span><span class="set-title">${esc(st.title)}<small>${esc(st.subtitle)}</small></span>`,
            `<span class="set-bpm"><i style="--beat:${60 / st.bpm}s"></i>${st.bpm} BPM</span>`,
            cleared ? `<em class="stamp">Clear</em><b>${(state.best[i] || 0).toLocaleString()}</b>`
              : unlocked ? `Play <span class="arr">→</span>` : "Locked",
            !unlocked, () => startStage(i));
        });
        if (state.cleared.size === state.portfolio.stages.length) {
          row(state.portfolio.stages.length, "encore", "∞",
            `<span class="set-year">All stages cleared</span><span class="set-title">커튼콜<small>Curtain Call</small></span>`,
            "<span></span>", `Open <span class="arr">→</span>`, false, openCurtain);
        }
        show("select");
      }

      // ------------------------------------------------------------ audio
      let audio = null, master = null, bus = null, noiseBuf = null;
      function ensureAudio() {
        if (audio) return audio;
        const Ctx = window.AudioContext || window.webkitAudioContext;
        if (!Ctx) return null;
        audio = new Ctx();
        // 여러 소리가 겹쳐도 찢어지지 않게 컴프레서를 거친다
        master = audio.createDynamicsCompressor();
        master.connect(audio.destination);
        noiseBuf = audio.createBuffer(1, audio.sampleRate, audio.sampleRate);
        const d = noiseBuf.getChannelData(0);
        for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
        return audio;
      }
      const now = () => (audio ? audio.currentTime : performance.now() / 1000);
      const out = () => bus || master;

      // 무대 하나의 소리는 전부 bus 하나로 모아, 중간에 나가면 미리 예약된 소리까지 한 번에 끈다
      function startBus() {
        stopBus();
        bus = audio.createGain();
        bus.connect(master);
      }
      function stopBus() {
        if (!bus) return;
        const b = bus;
        bus = null;
        b.gain.setTargetAtTime(0, audio.currentTime, 0.04);
        setTimeout(() => b.disconnect(), 400);
      }

      function click(time, freq, gain = 0.15, dur = 0.05, type = "sine") {
        if (!audio) return;
        const o = audio.createOscillator();
        const g = audio.createGain();
        o.type = type;
        o.frequency.setValueAtTime(freq, time);
        o.frequency.exponentialRampToValueAtTime(Math.max(40, freq * 0.5), time + dur);
        g.gain.setValueAtTime(gain, time);
        g.gain.exponentialRampToValueAtTime(0.001, time + dur);
        o.connect(g).connect(out());
        o.start(time);
        o.stop(time + dur + 0.02);
      }

      const mtof = (m) => 440 * Math.pow(2, (m - 69) / 12);
      function tone(time, midi, dur, opt = {}) {
        if (!audio) return;
        const { type = "triangle", gain = 0.06, attack = 0.01, cutoff = 0, detune = 0, dest = out() } = opt;
        const osc = audio.createOscillator(), g = audio.createGain();
        osc.type = type;
        osc.frequency.value = mtof(midi);
        osc.detune.value = detune;
        g.gain.setValueAtTime(0.0001, time);
        g.gain.exponentialRampToValueAtTime(gain, time + attack);
        g.gain.exponentialRampToValueAtTime(0.0001, time + dur);
        let node = osc;
        if (cutoff) {
          const f = audio.createBiquadFilter();
          f.type = "lowpass"; f.frequency.value = cutoff;
          osc.connect(f); node = f;
        }
        node.connect(g).connect(dest);
        osc.start(time);
        osc.stop(time + dur + 0.05);
      }
      function noise(time, dur, { gain = 0.05, type = "highpass", freq = 7000, sweepTo = 0, dest = out() } = {}) {
        if (!audio) return;
        const src = audio.createBufferSource(), f = audio.createBiquadFilter(), g = audio.createGain();
        src.buffer = noiseBuf; src.loop = true;
        f.type = type; f.frequency.setValueAtTime(freq, time);
        if (sweepTo) f.frequency.exponentialRampToValueAtTime(sweepTo, time + dur);
        g.gain.setValueAtTime(gain, time);
        g.gain.exponentialRampToValueAtTime(0.0001, time + dur);
        src.connect(f).connect(g).connect(dest);
        src.start(time);
        src.stop(time + dur + 0.02);
      }

      // 드럼
      const kick = (t, v = 0.55) => click(t, 140, v, 0.18);
      const snare = (t, v = 0.13) => { noise(t, 0.14, { gain: v, type: "bandpass", freq: 1900 }); click(t, 210, v * 0.7, 0.07, "triangle"); };
      const clap = (t, v = 0.12) => { noise(t, 0.1, { gain: v, type: "bandpass", freq: 1300 }); noise(t + 0.012, 0.12, { gain: v * 0.8, type: "bandpass", freq: 1100 }); };
      const hat = (t, v = 0.03, len = 0.035) => noise(t, len, { gain: v, freq: 8500 });

      // 무대별 곡: 조(root, MIDI 번호)와 한 마디마다 바뀌는 코드 진행, 연주 스타일. 32박 = 8마디
      const CHORD = { maj: [0, 4, 7], m: [0, 3, 7], maj7: [0, 4, 7, 11], m7: [0, 3, 7, 10], dom7: [0, 4, 7, 10] };
      const SONGS = [
        { style: "lofi", root: 53, lead: "sine", prog: [[0, "maj7"], [4, "m7"], [9, "m7"], [5, "maj7"]] },      // 2023 연습생: F장조 로파이
        { style: "funk", root: 55, lead: "square", prog: [[9, "m7"], [5, "maj7"], [0, "maj"], [7, "dom7"]] },   // 2024 데뷔: G장조 펑키 팝
        { style: "house", root: 50, lead: "triangle", prog: [[0, "m7"], [8, "maj7"], [3, "maj"], [10, "maj"]] }, // 2025 메인 스테이지: D단조 하우스
        { style: "edm", root: 52, lead: "sawtooth", prog: [[0, "m"], [8, "maj"], [3, "maj"], [10, "maj"]] },     // 2026 앵콜: E단조 빌드업 → 드롭
      ];

      function scheduleMusic(index, start, beatDur, notes) {
        const song = SONGS[index] || SONGS[SONGS.length - 1];
        const e = beatDur / 2, s = beatDur / 4;
        const chordAt = (beat) => {
          const [deg, kind] = song.prog[Math.floor(beat / 4) % song.prog.length];
          return CHORD[kind].map((n) => song.root + deg + n);
        };
        for (let b = -LEAD_IN; b < 0; b++) click(start + b * beatDur, 880, 0.1, 0.06); // 카운트인

        for (let bar = 0; bar < BEATS / 4; bar++) {
          const t0 = start + bar * 4 * beatDur;
          const ch = chordAt(bar * 4), bass = ch[0] - 12;
          if (song.style === "lofi") {
            ch.forEach((m) => tone(t0, m, 4 * beatDur, { gain: 0.03, attack: 0.3, cutoff: 1300 }));
            tone(t0, bass, 1.6 * beatDur, { type: "sine", gain: 0.18 });
            tone(t0 + 2.5 * beatDur, bass + 7, beatDur, { type: "sine", gain: 0.13 });
          } else if (song.style === "funk") {
            [1, 0, 1, 1, 0, 1, 0, 1].forEach((on, k) => on && tone(t0 + k * e, bass + (k === 3 || k === 7 ? 12 : 0), e * 0.8, { type: "square", gain: 0.06, cutoff: 700 }));
            [1, 3].forEach((beat) => ch.forEach((m) => tone(t0 + beat * beatDur + e, m + 12, 0.14, { type: "square", gain: 0.022, cutoff: 2600 })));
          } else if (song.style === "house") {
            for (let k = 0; k < 4; k++) {
              tone(t0 + k * beatDur + e, bass, e * 0.9, { type: "sawtooth", gain: 0.07, cutoff: 600 });
              ch.forEach((m) => tone(t0 + k * beatDur + e, m + 12, 0.16, { type: "sawtooth", gain: 0.02, cutoff: 1900 }));
            }
          } else if (bar < 4) {
            // 앵콜 빌드업: 16분음 아르페지오가 점점 촘촘해지고, 마지막 두 마디에 노이즈가 차오른다
            for (let k = 0; k < 16; k++) tone(t0 + k * s, ch[k % ch.length] + 12, s * 0.9, { type: "square", gain: 0.015 + bar * 0.006, cutoff: 1200 + bar * 700 });
            if (bar === 2) noise(t0, 8 * beatDur, { gain: 0.05, type: "bandpass", freq: 400, sweepTo: 7000 });
          } else {
            // 드롭: 디튠한 톱니파 코드가 박마다 펌핑(사이드체인 느낌)
            const pump = audio.createGain();
            pump.connect(out());
            for (let k = 0; k < 4; k++) {
              pump.gain.setValueAtTime(0.25, t0 + k * beatDur);
              pump.gain.linearRampToValueAtTime(1, t0 + k * beatDur + e);
            }
            ch.forEach((m) => [-14, 0, 14].forEach((dt) => tone(t0, m + 12, 4 * beatDur, { type: "sawtooth", gain: 0.014, attack: 0.02, cutoff: 3200, detune: dt, dest: pump })));
            for (let k = 0; k < 4; k++) tone(t0 + k * beatDur + e, bass, e * 0.9, { type: "sawtooth", gain: 0.08, cutoff: 500 });
          }
        }

        for (let b = 0; b < BEATS; b++) {
          const t = start + b * beatDur, inBar = b % 4;
          if (song.style === "lofi") {
            if (inBar === 0 || inBar === 2) kick(t, 0.45);
            if (inBar === 1 || inBar === 3) snare(t, 0.07);
            hat(t, 0.02); hat(t + beatDur * 0.62, 0.014); // 스윙
          } else if (song.style === "funk") {
            if (inBar === 0 || inBar === 2) kick(t);
            if (inBar === 2) kick(t + e, 0.35);
            if (inBar === 1 || inBar === 3) snare(t);
            for (let k = 0; k < 4; k++) hat(t + k * s, k % 2 ? 0.012 : 0.026);
          } else if (song.style === "house") {
            kick(t);
            if (inBar === 1 || inBar === 3) clap(t);
            hat(t + e, 0.035, 0.09); // 오픈 하이햇
          } else if (b < 16) {
            if (b < 8 || inBar === 0) kick(t, 0.5);
            if (b >= 8 && b < 12) { snare(t, 0.08); snare(t + e, 0.08); }
            if (b >= 12) for (let k = 0; k < 4; k++) snare(t + k * s, 0.05 + (b - 12) * 0.02);
          } else {
            kick(t);
            if (inBar === 1 || inBar === 3) clap(t, 0.14);
            hat(t + e, 0.03, 0.06);
          }
        }

        // 노트가 떨어지는 자리에서 멜로디가 울린다: 레인마다 지금 코드의 다른 음
        notes.forEach((n) => {
          const beat = Math.max(0, Math.floor((n.t - start) / beatDur + 1e-6));
          const ch = chordAt(beat);
          const midi = ch[n.lane % ch.length] + 12 + (n.lane === 3 ? 12 : 0);
          tone(n.t, midi, song.style === "lofi" ? 0.45 : 0.16, { type: song.lead, gain: song.lead === "sine" ? 0.06 : 0.025, cutoff: song.lead === "sine" ? 0 : 2800 });
        });

        // 마무리: 마지막 박에 코드 한 번
        const end = start + BEATS * beatDur, last = chordAt(BEATS - 1);
        kick(end);
        last.forEach((m) => tone(end, m + 12, 1.4, { type: "triangle", gain: 0.04 }));
      }

      // 커튼이 열릴 때 반짝이는 효과음 (도미솔도 아르페지오)
      function chime() {
        if (!ensureAudio()) return;
        if (audio.state === "suspended") audio.resume();
        const t = audio.currentTime + 0.02;
        [84, 88, 91, 96, 100, 103].forEach((m, k) => {
          tone(t + k * 0.075, m, 1.1, { type: "sine", gain: 0.07, attack: 0.005, dest: master });
          tone(t + k * 0.075, m + 12, 0.5, { type: "sine", gain: 0.018, attack: 0.005, dest: master });
        });
      }

      // ------------------------------------------------------------ chart
      function rng(seed) {
        let s = seed >>> 0;
        return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; };
      }

      function buildChart(index, stage, start) {
        const [perBeat, prob, chordProb] = DIFFICULTY[index] || DIFFICULTY[DIFFICULTY.length - 1];
        const rand = rng(stage.year * 31 + index);
        const step = 60 / stage.bpm / perBeat;
        const notes = [];
        let last = -1;
        for (let i = 0; i < BEATS * perBeat; i++) {
          const onBeat = i % perBeat === 0;
          if (rand() > (onBeat ? prob : prob * 0.7)) continue;
          let lane = Math.floor(rand() * LANES);
          if (lane === last && rand() < 0.6) lane = (lane + 1 + Math.floor(rand() * 3)) % LANES;
          last = lane;
          const t = start + i * step;
          notes.push({ t, lane, judged: false });
          if (onBeat && rand() < chordProb) notes.push({ t, lane: (lane + 2) % LANES, judged: false });
        }
        return notes;
      }

      // ------------------------------------------------------------ gameplay
      const canvas = $("canvas");
      const ctx2d = canvas.getContext("2d");
      const W = 360, H = 520, LANE_W = W / LANES, JUDGE_Y = H - 72, SPEED = 380;
      (function setupCanvas() {
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = W * dpr; canvas.height = H * dpr;
        ctx2d.setTransform(dpr, 0, 0, dpr, 0, 0);
      })();

      function startStage(index) {
        ensureAudio();
        if (audio && audio.state === "suspended") audio.resume();
        const stage = state.portfolio.stages[index];
        const beatDur = 60 / stage.bpm;
        const start = now() + 0.6 + LEAD_IN * beatDur;
        const notes = buildChart(index, stage, start);
        if (audio) { startBus(); scheduleMusic(index, start, beatDur, notes); }
        state.current = {
          index, stage, start, beatDur, notes,
          end: start + BEATS * beatDur + 0.8,
          score: 0, combo: 0, maxCombo: 0, perfect: 0, good: 0, miss: 0,
          flash: { text: "", t: 0 }, laneFlash: [0, 0, 0, 0], running: true, lastBeat: null,
        };
        $("dancer").style.setProperty("--t", `${Math.min(0.18, beatDur * 0.3)}s`);
        $("hudStage").textContent = `Stage ${index + 1} · ${stage.grade}`;
        $("hudTitle").textContent = `${stage.year} ${stage.title}`;
        updateHud();
        show("play");
        requestAnimationFrame(loop);
      }

      function judge(note, dt) {
        const g = state.current;
        note.judged = true;
        const a = Math.abs(dt);
        if (a <= WINDOW.perfect) { g.perfect++; g.combo++; g.score += 300; flash("PERFECT"); dancerReact("hop"); }
        else if (a <= WINDOW.good) { g.good++; g.combo++; g.score += 120; flash("GOOD"); }
        else { g.miss++; g.combo = 0; flash("MISS"); dancerReact("wobble"); return; }
        g.score += Math.floor(g.combo / 10) * 20;
        g.maxCombo = Math.max(g.maxCombo, g.combo);
        if (g.combo % 10 === 0) dancerReact("pop", `${g.combo} COMBO`);
        click(now(), 1400, 0.05, 0.03, "triangle");
      }

      function flash(text) { state.current.flash = { text, t: now() }; updateHud(); }

      // ------------------------------------------------------------ dancer
      // 무대마다 다른 4박 안무. 포즈 = [왼팔, 왼팔꿈치, 오른팔, 오른팔꿈치, 왼다리, 오른다리, 몸 기울기, 높이(px, +는 아래), 머리]
      // 팔은 아래로 내린 상태가 0도, 왼팔은 +로·오른팔은 −로 갈수록 바깥/위로 올라간다
      const MOVES = [
        [[35, 100, -35, -100, 6, 0, -5, 0, -8], [20, 60, -20, -60, 0, 0, 0, 5, 0],
          [35, 100, -35, -100, 0, -6, 5, 0, 8], [20, 60, -20, -60, 0, 0, 0, 5, 0]],         // 연습생: 손 모으고 좌우 스텝
        [[140, 15, -20, -30, 8, -4, 6, 0, 6], [40, 30, -40, -30, 0, 0, 0, 6, 0],
          [20, 30, -140, -15, 4, -8, -6, 0, -6], [40, 30, -40, -30, 0, 0, 0, 6, 0]],         // 데뷔: 디스코 포인트
        [[90, 30, -90, -30, 5, -5, 0, 6, 0], [100, -40, -100, 40, 0, 0, 0, 0, 0],
          [70, 60, -70, -60, 5, -5, 0, 6, 0], [120, 20, -60, -70, 0, 0, 4, 0, 5]],           // 메인 스테이지: 팔 웨이브
        [[135, 20, -135, -20, 10, -10, 0, -4, 0], [60, 100, -60, -100, 0, 0, 0, 8, 0],
          [135, 40, -40, -110, 12, -4, -8, -2, -8], [40, 110, -135, -40, 4, -12, 8, -2, 8]], // 앵콜: 양팔 번쩍
      ];
      const POSE_VARS = ["--al", "--al2", "--ar", "--ar2", "--ll", "--lr", "--tilt", "--y", "--head"];
      function setPose(p) {
        const d = $("dancer");
        POSE_VARS.forEach((v, k) => d.style.setProperty(v, v === "--y" ? `${p[k]}px` : `${p[k]}deg`));
      }

      // 박이 바뀔 때만 다음 포즈로 넘어간다. 카운트인 동안은 가볍게 들썩이고, 끝나면 양팔을 든다
      function danceTo(g, beat) {
        if (beat === g.lastBeat) return;
        g.lastBeat = beat;
        if (beat < 0) setPose([12, 20, -12, -20, 0, 0, 0, beat % 2 ? 4 : 0, 0]);
        else if (beat >= BEATS) setPose([135, 20, -135, -20, 6, -6, 0, 0, 0]);
        else setPose((MOVES[g.index] || MOVES[0])[beat % 4]);
      }

      // 판정 반응: 같은 클래스를 다시 붙여 애니메이션을 처음부터 재생한다
      function dancerReact(cls, text) {
        const d = $("dancer");
        if (text) $("dancerPop").textContent = text;
        d.classList.remove(cls);
        void d.offsetWidth;
        d.classList.add(cls);
      }

      function press(lane) {
        const g = state.current;
        if (!g || !g.running) return;
        g.laneFlash[lane] = now();
        const t = now();
        let target = null;
        for (const n of g.notes) {
          if (n.judged || n.lane !== lane) continue;
          const dt = t - n.t;
          if (Math.abs(dt) <= WINDOW.miss && (!target || Math.abs(dt) < Math.abs(t - target.t))) target = n;
        }
        if (target) judge(target, t - target.t);
      }

      function updateHud() {
        const g = state.current;
        if (!g) return;
        $("hudScore").textContent = g.score.toLocaleString();
        $("hudCombo").textContent = g.combo > 1 ? `${g.combo} combo` : "";
      }

      function drawArrow(x, y, lane, fill, stroke, size = 26) {
        ctx2d.save();
        ctx2d.translate(x, y);
        ctx2d.rotate(ROTATION[lane]);
        ctx2d.beginPath();
        ctx2d.moveTo(0, -size);
        ctx2d.lineTo(size, 2);
        ctx2d.lineTo(size * 0.42, 2);
        ctx2d.lineTo(size * 0.42, size);
        ctx2d.lineTo(-size * 0.42, size);
        ctx2d.lineTo(-size * 0.42, 2);
        ctx2d.lineTo(-size, 2);
        ctx2d.closePath();
        if (fill) { ctx2d.fillStyle = fill; ctx2d.fill(); }
        if (stroke) { ctx2d.lineWidth = 2; ctx2d.strokeStyle = stroke; ctx2d.stroke(); }
        ctx2d.restore();
      }

      function loop() {
        const g = state.current;
        if (!g || !g.running) return;
        const t = now();

        for (const n of g.notes) {
          if (!n.judged && t - n.t > WINDOW.miss) { n.judged = true; g.miss++; g.combo = 0; flash("MISS"); dancerReact("wobble"); }
        }
        danceTo(g, Math.floor((t - g.start) / g.beatDur));

        ctx2d.clearRect(0, 0, W, H);
        ctx2d.fillStyle = C.paper; ctx2d.fillRect(0, 0, W, H);
        for (let l = 0; l < LANES; l++) {
          const x = l * LANE_W;
          if (t - g.laneFlash[l] < 0.12) { ctx2d.fillStyle = "rgba(127,156,122,0.12)"; ctx2d.fillRect(x, 0, LANE_W, H); }
          if (l > 0) { ctx2d.fillStyle = C.line; ctx2d.fillRect(x, 0, 1, H); }
          drawArrow(x + LANE_W / 2, JUDGE_Y, l, null, t - g.laneFlash[l] < 0.12 ? C.matcha : C.muted);
        }
        ctx2d.fillStyle = C.ink; ctx2d.fillRect(12, JUDGE_Y + 34, W - 24, 1);

        for (const n of g.notes) {
          if (n.judged) continue;
          const y = JUDGE_Y - (n.t - t) * SPEED;
          if (y < -40 || y > H + 40) continue;
          drawArrow(n.lane * LANE_W + LANE_W / 2, y, n.lane, n.lane % 3 === 0 ? C.pink : C.matcha);
        }

        // 박자 표시 (판정선 아래 점)
        const beat = Math.floor((t - g.start) / g.beatDur);
        if (beat >= 0 && beat < BEATS) {
          for (let i = 0; i < 4; i++) {
            ctx2d.fillStyle = i === ((beat % 4) + 4) % 4 ? C.ink : C.line;
            ctx2d.beginPath(); ctx2d.arc(W / 2 - 27 + i * 18, H - 18, 4, 0, Math.PI * 2); ctx2d.fill();
          }
        }

        const age = t - g.flash.t;
        if (g.flash.text && age < 0.45) {
          ctx2d.globalAlpha = 1 - age / 0.45;
          ctx2d.fillStyle = g.flash.text === "MISS" ? C.pink : C.matcha;
          ctx2d.font = "700 22px Pretendard, sans-serif";
          ctx2d.textAlign = "center";
          ctx2d.fillText(g.flash.text, W / 2, H * 0.42);
          ctx2d.globalAlpha = 1;
        }

        const lead = g.start - t;
        $("countdown").textContent = lead > 0 ? Math.ceil(lead / g.beatDur) : "";

        if (t >= g.end) return finishStage();
        requestAnimationFrame(loop);
      }

      function finishStage() {
        const g = state.current;
        g.running = false;
        const total = g.notes.length || 1;
        const acc = (g.perfect + g.good * 0.6) / total;
        const clear = acc >= CLEAR_ACCURACY;
        const i = g.index;
        const isLast = i === state.portfolio.stages.length - 1;

        if (clear) {
          state.cleared.add(i);
          state.best[i] = Math.max(state.best[i] || 0, g.score);
          saveProgress();
        }

        $("resultCard").classList.toggle("is-clear", clear);
        $("resultEyebrow").textContent = clear ? `Stage ${i + 1} · ${g.stage.grade} · Clear` : `Stage ${i + 1} · Retry`;
        $("resultTitle").textContent = clear ? `${g.stage.year}, ${g.stage.title}` : "박자를 조금 놓쳤어요";
        const stats = [
          ["Accuracy", acc * 100, (v) => `${v.toFixed(1)}%`],
          ["Score", g.score, (v) => Math.round(v).toLocaleString()],
          ["Max Combo", g.maxCombo, (v) => Math.round(v)],
          ["Perfect", g.perfect, (v) => Math.round(v)],
          ["Good", g.good, (v) => Math.round(v)],
          ["Miss", g.miss, (v) => Math.round(v)],
        ];
        $("resultStats").innerHTML = stats.map(([k]) => `<div><dt>${k}</dt><dd></dd></div>`).join("");
        $("resultStats").querySelectorAll("dd").forEach((dd, k) => countUp(dd, stats[k][1], stats[k][2]));
        $("chapter").innerHTML = clear ? chapterHTML(g.stage, 600) : "";

        const actions = $("resultActions");
        actions.innerHTML = "";
        const btn = (label, cls, fn) => {
          const b = document.createElement("button");
          b.type = "button"; b.className = cls; b.textContent = label; b.addEventListener("click", fn);
          actions.appendChild(b);
        };
        if (clear) {
          if (isLast) btn("커튼콜로 가기", "primary", openCurtain);
          else btn("다음 무대", "primary", () => startStage(i + 1));
          btn("셋리스트", "ghost", renderSetlist);
        } else {
          btn("다시 도전하기", "primary", () => startStage(i));
          btn("이 해의 기록만 보기", "ghost", () => { $("chapter").innerHTML = chapterHTML(g.stage); });
          btn("셋리스트", "ghost", renderSetlist);
        }
        show("result");
      }

      // ------------------------------------------------------------ curtain call (DB tier)
      async function api(path, body) {
        const res = await fetch(path, body ? {
          method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body),
        } : undefined);
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.error || res.statusText);
        return data;
      }

      function dbError(e) { $("dbNote").textContent = `데이터베이스에 연결하지 못했어요 (${e.message}). 잠시 후 다시 시도해주세요.`; }

      async function refreshBoard() {
        try {
          const [{ scores }, { cheers }] = await Promise.all([api("/api/scores"), api("/api/cheers")]);
          // 서버가 저장 전에 HTML 이스케이프하므로 그대로 출력해도 안전하다.
          $("ranking").innerHTML = scores.length
            ? scores.map((s) => `<li>${s.name}<span>${s.score.toLocaleString()}</span></li>`).join("")
            : `<li class="muted">아직 기록이 없어요. 첫 번째 관객이 되어주세요.</li>`;
          $("cheers").innerHTML = cheers.length
            ? cheers.map((c) => `<li><b>${c.name}</b>${c.message}<time>${new Date(c.at * 1000).toLocaleString("ko-KR")}</time></li>`).join("")
            : `<li class="muted">첫 응원을 남겨주세요.</li>`;
          $("dbNote").textContent = "";
        } catch (e) { dbError(e); }
      }

      function openCurtain() {
        const p = state.portfolio;
        if (!p) return;
        curtainTransition(() => {
          $("ownerHeadline").textContent = p.headline;
          $("ownerAbout").textContent = p.about;
          $("ownerLinks").innerHTML = (p.links || [])
            .map((l) => `<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.label)} ↗</a>`).join("");
          $("ownerFacts").innerHTML = (p.facts || [])
            .map((f) => `<div><dt>${esc(f.label)}</dt><dd>${esc(f.value)}</dd></div>`).join("");
          $("spotlight").innerHTML = spotlightHTML(p, 1250);
          $("timeline").innerHTML = p.stages.map((s, k) => programHTML(s, 1600 + k * 120)).join("");
          $("roadmap").innerHTML = (p.roadmap || [])
            .map((r) => `<li><span class="r-year">${esc(r.year)}</span><h4>${esc(r.title)}</h4><p>${esc(r.text)}</p></li>`).join("");
          const total = totalScore();
          $("myScore").textContent = total > 0
            ? `내 총점 ${total.toLocaleString()}점 (클리어한 무대 ${state.cleared.size}/${p.stages.length})`
            : "무대를 하나 이상 클리어하면 점수를 남길 수 있어요.";
          $("scoreForm").querySelector("button").disabled = total === 0;
          show("curtain");
          refreshBoard();
        });
      }

      // 막이 닫히고 → 그 사이 화면을 바꾸고 → 막이 양옆으로 걷힌다
      let curtainBusy = false;
      function curtainTransition(swap) {
        ensureAudio(); // 클릭 순간에 만들어 둬야 브라우저가 소리를 막지 않는다
        if (!MOTION) { chime(); return swap(); }
        if (curtainBusy) return;
        curtainBusy = true;
        const box = $("curtains"), [L, R] = box.querySelectorAll("div"), label = box.querySelector(".c-label");
        box.classList.add("on");
        const close = { duration: 650, easing: "cubic-bezier(.6, 0, .3, 1)", fill: "forwards" };
        const open = { duration: 1500, easing: "cubic-bezier(.7, 0, .2, 1)", fill: "forwards" };
        const side = (dir) => [
          { transform: "none" },
          { transform: `translateX(${dir * 10}%) scaleX(.94)`, offset: 0.25 },
          { transform: `translateX(${dir * 101}%) scaleX(.6)` },
        ];
        Promise.all([
          L.animate([{ transform: "translateX(-101%)" }, { transform: "none" }], close).finished,
          R.animate([{ transform: "translateX(101%)" }, { transform: "none" }], close).finished,
          label.animate([{ opacity: 0 }, { opacity: 1 }], { ...close, delay: 250 }).finished,
        ])
          .then(() => { swap(); return new Promise((r) => setTimeout(r, 350)); })
          .then(() => {
            chime();
            label.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 300, fill: "forwards" });
            return Promise.all([L.animate(side(-1), open).finished, R.animate(side(1), open).finished]);
          })
          .finally(() => {
            box.classList.remove("on");
            L.getAnimations().concat(R.getAnimations(), label.getAnimations()).forEach((a) => a.cancel());
            curtainBusy = false;
          });
      }

      // 결과 숫자가 0부터 차오른다
      function countUp(el, to, fmt) {
        if (!MOTION) { el.textContent = fmt(to); return; }
        const t0 = performance.now() + 350, D = 900;
        const step = (t) => {
          const k = Math.min(1, Math.max(0, (t - t0) / D));
          el.textContent = fmt(to * (1 - Math.pow(1 - k, 3)));
          if (k < 1) requestAnimationFrame(step);
        };
        el.textContent = fmt(0);
        requestAnimationFrame(step);
      }

      $("scoreForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        try {
          const r = await api("/api/scores", { name: $("scoreName").value, score: totalScore() });
          $("myScore").textContent = `${r.rank}위로 기록됐어요.`;
          refreshBoard();
        } catch (err) { dbError(err); }
      });

      $("cheerForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        try {
          await api("/api/cheers", { name: $("cheerName").value, message: $("cheerMsg").value });
          $("cheerMsg").value = "";
          refreshBoard();
        } catch (err) { dbError(err); }
      });

      // ------------------------------------------------------------ input
      document.addEventListener("keydown", (e) => {
        if (!state.current || !state.current.running) return;
        if (e.code === "Escape") { state.current.running = false; stopBus(); renderSetlist(); return; }
        const lane = KEYMAP[e.code];
        if (lane === undefined || e.repeat) return;
        e.preventDefault();
        press(lane);
      });
      document.querySelectorAll("#pads button").forEach((b) => {
        b.addEventListener("pointerdown", (e) => {
          e.preventDefault();
          press(Number(b.dataset.lane));
          b.classList.add("hit");
          setTimeout(() => b.classList.remove("hit"), 100);
        });
      });

      // ------------------------------------------------------------ intro ticket
      const MOTION = document.documentElement.classList.contains("motion");
      const FINE = matchMedia("(pointer: fine)").matches;
      const ticket = $("ticket");

      // 셋리스트 줄은 HTML에 미리 있고 글자만 바꿔서, 등장 애니메이션이 다시 시작되지 않게 한다
      function renderTicket(p) {
        document.querySelectorAll("#ticketSetlist li").forEach((li, i) => {
          const st = p.stages[i];
          if (!st) return;
          li.querySelector(".y").textContent = st.year;
          li.querySelector(".ti").innerHTML = `${esc(st.title)}<small>${esc(st.subtitle)}</small>`;
          li.querySelector(".bpm b").textContent = st.bpm;
          li.querySelector(".bpm i").style.setProperty("--beat", `${60 / st.bpm}s`);
        });
      }

      // 마우스를 따라 티켓이 살짝 기울고 빛 반사가 따라온다
      if (MOTION && FINE) {
        const clamp = (v) => Math.min(1, Math.max(0, v));
        $("intro").addEventListener("pointermove", (e) => {
          const r = ticket.getBoundingClientRect();
          const x = clamp((e.clientX - r.left) / r.width), y = clamp((e.clientY - r.top) / r.height);
          ticket.classList.add("tilting");
          ticket.style.setProperty("--ry", `${(x - 0.5) * 8}deg`);
          ticket.style.setProperty("--rx", `${(0.5 - y) * 8}deg`);
          ticket.style.setProperty("--mx", `${e.clientX - r.left}px`);
          ticket.style.setProperty("--my", `${e.clientY - r.top}px`);
        });
        $("intro").addEventListener("pointerleave", () => {
          ticket.classList.remove("tilting");
          ticket.style.setProperty("--rx", "0deg");
          ticket.style.setProperty("--ry", "0deg");
        });
      }

      // 입장: 꼬리표가 찢겨 나간 뒤 셋리스트로
      $("startBtn").addEventListener("click", (e) => {
        ensureAudio();
        if (!MOTION || !state.portfolio) return renderSetlist();
        e.currentTarget.disabled = true;
        ticket.classList.remove("tilting");
        ticket.classList.add("torn");
        setTimeout(renderSetlist, 700);
      });

      // ------------------------------------------------------------ detail bubbles
      // 같은 목록에서는 말풍선을 하나만 열어 둔다
      function toggleDetail(el, open = el.getAttribute("aria-expanded") !== "true") {
        if (open) {
          el.parentElement.querySelectorAll('.has-detail[aria-expanded="true"]')
            .forEach((o) => { if (o !== el) o.setAttribute("aria-expanded", "false"); });
        }
        el.setAttribute("aria-expanded", String(open));
      }

      document.addEventListener("click", (e) => {
        const spot = e.target.closest(".spot");
        if (spot) {
          const li = [...document.querySelectorAll("#timeline .has-detail")].find((x) => x.dataset.title === spot.dataset.ref);
          if (!li) return;
          toggleDetail(li, true);
          li.scrollIntoView({ behavior: MOTION ? "smooth" : "auto", block: "center" });
          li.classList.remove("ping");
          void li.offsetWidth; // 연속으로 눌러도 깜빡임이 다시 재생되도록
          li.classList.add("ping");
          return;
        }
        // 말풍선 안의 글을 고르거나 누를 때는 닫지 않는다
        if (e.target.closest(".bubble-text")) return;
        const el = e.target.closest(".has-detail");
        if (el) toggleDetail(el);
      });
      document.addEventListener("keydown", (e) => {
        if ((e.key === "Enter" || e.key === " ") && e.target.classList && e.target.classList.contains("has-detail")) {
          e.preventDefault();
          toggleDetail(e.target);
        }
      });

      // ------------------------------------------------------------ cursor trail
      // 마우스가 지나간 길을 짧게 남긴다 (말차 → 핑크). 꼬리가 다 사라지면 그리기를 멈춘다
      (() => {
        const cv = $("trail");
        const cx = cv.getContext("2d");
        if (!MOTION || !FINE || !cx) return;
        const LIFE = 350, HEAD = [127, 156, 122], TAIL = [214, 162, 160];
        const mix = (a, b, f) => a + (b - a) * f;
        let pts = [], frame = 0;

        function resize() {
          const d = window.devicePixelRatio || 1;
          cv.width = innerWidth * d; cv.height = innerHeight * d;
          cx.setTransform(d, 0, 0, d, 0, 0);
        }
        function draw() {
          const t = performance.now();
          pts = pts.filter((p) => t - p.t < LIFE);
          cx.clearRect(0, 0, innerWidth, innerHeight);
          for (let i = 1; i < pts.length - 1; i++) {
            const a = pts[i - 1], b = pts[i], c = pts[i + 1];
            const f = Math.min(1, (t - b.t) / LIFE);
            const [r, g, bl] = HEAD.map((h, k) => Math.round(mix(h, TAIL[k], f)));
            cx.strokeStyle = `rgba(${r}, ${g}, ${bl}, ${1 - f})`;
            cx.lineWidth = mix(3, 0.5, f);
            cx.beginPath();
            cx.moveTo((a.x + b.x) / 2, (a.y + b.y) / 2);
            cx.quadraticCurveTo(b.x, b.y, (b.x + c.x) / 2, (b.y + c.y) / 2);
            cx.stroke();
          }
          frame = pts.length ? requestAnimationFrame(draw) : 0;
        }

        resize();
        addEventListener("resize", resize);
        addEventListener("pointermove", (e) => {
          if (e.pointerType !== "mouse") return;
          const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [];
          for (const ev of evs.length ? evs : [e]) pts.push({ x: ev.clientX, y: ev.clientY, t: performance.now() });
          if (!frame) frame = requestAnimationFrame(draw);
        });
      })();

      $("skipBtn").addEventListener("click", () => {
        if (state.current) state.current.running = false;
        if (audio) stopBus();
        openCurtain();
      });
      $("replayBtn").addEventListener("click", renderSetlist);

      // ------------------------------------------------------------ boot
      loadProgress();
      fetch("/api/portfolio")
        .then((r) => r.json())
        .then((p) => {
          state.portfolio = p;
          renderTicket(p);
        })
        .catch(() => { $("introNote").textContent = "포트폴리오 데이터를 불러오지 못했어요. 잠시 후 새로고침해주세요."; });
      fetch("/api/info").then((r) => r.json())
        .then((i) => { $("podInfo").textContent = `served by pod ${i.pod} · OpenShift Developer Sandbox`; })
        .catch(() => {});
    })();
  style.css: |
    :root {
      --cream: #f5f0e6;
      --paper: #fbf8f2;
      --ink: #2b2a27;
      --muted: #8a857b;
      --line: #e2dccf;
      --matcha: #7f9c7a;
      --matcha-deep: #5f7b5b;
      --pink: #d6a2a0;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--cream); color: var(--ink); }
    body {
      font-family: "Pretendard", -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      font-size: 15px; line-height: 1.65; letter-spacing: -0.02em;
      max-width: 720px; margin: 0 auto; padding: 0 20px 48px;
      -webkit-font-smoothing: antialiased;
    }
    button, input, textarea { font: inherit; letter-spacing: inherit; color: inherit; }

    .topbar { display: flex; justify-content: space-between; align-items: center; padding: 20px 0 8px; border-bottom: 1px solid var(--line); }
    .brand { font-weight: 700; font-size: 14px; letter-spacing: -0.03em; }
    .brand::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--matcha); margin-right: 8px; vertical-align: 1px; }
    .link { background: none; border: 0; padding: 4px 0; font-size: 13px; color: var(--matcha-deep); cursor: pointer; }
    .link:hover { text-decoration: underline; }

    .screen { display: none; padding-top: 40px; animation: fade .35s ease; }
    .screen.active { display: block; }
    @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

    .eyebrow { display: block; font-size: 12px; color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; margin: 0 0 8px; }
    h1 { font-size: 34px; line-height: 1.25; letter-spacing: -0.045em; margin: 0 0 16px; font-weight: 700; }
    h2 { font-size: 24px; line-height: 1.35; letter-spacing: -0.04em; margin: 0 0 12px; font-weight: 700; }
    h3 { font-size: 14px; margin: 0 0 12px; letter-spacing: -0.02em; }
    .lead { color: #4d4a44; margin: 0 0 24px; }
    .muted { color: var(--muted); }

    /* intro: 공연 티켓 */
    .ticket-wrap { max-width: 640px; margin: 4px auto 0; }
    .ticket {
      --rx: 0deg; --ry: 0deg; --mx: 50%; --my: 50%; --notch: 11px;
      display: grid; grid-template-columns: 1fr 156px;
      filter: drop-shadow(0 18px 26px rgba(43, 42, 39, .13)) drop-shadow(0 1px 1px rgba(43, 42, 39, .08));
      transform: perspective(1100px) rotateX(var(--rx)) rotateY(var(--ry));
      transition: transform .6s cubic-bezier(.16, 1, .3, 1);
    }
    .ticket.tilting { transition: transform .1s linear; }
    /* 본권·꼬리표에 따로 마스크를 씌워 절취선 양끝에 반원 홈을 판다 (꼬리표만 찢어져 나갈 수 있게) */
    .ticket-main {
      position: relative; overflow: hidden; padding: 28px 30px 24px; background: var(--paper); border-radius: 18px 0 0 18px;
      --m: radial-gradient(circle var(--notch) at 100% 0, #0000 98%, #000) top / 100% 51% no-repeat,
           radial-gradient(circle var(--notch) at 100% 100%, #0000 98%, #000) bottom / 100% 51% no-repeat;
      -webkit-mask: var(--m); mask: var(--m);
    }
    .ticket-main::after {
      content: ""; position: absolute; inset: 0; pointer-events: none; opacity: 0; transition: opacity .4s;
      background: radial-gradient(360px circle at var(--mx) var(--my), rgba(255, 255, 255, .6), transparent 60%);
    }
    .ticket.tilting .ticket-main::after { opacity: 1; }
    .ticket-stub {
      display: flex; flex-direction: column; justify-content: space-between; gap: 14px;
      padding: 26px 22px 22px; background: #f7f2e8; border-left: 1.5px dashed #cfc6b4; border-radius: 0 18px 18px 0;
      --m: radial-gradient(circle var(--notch) at 0 0, #0000 98%, #000) top / 100% 51% no-repeat,
           radial-gradient(circle var(--notch) at 0 100%, #0000 98%, #000) bottom / 100% 51% no-repeat;
      -webkit-mask: var(--m); mask: var(--m);
      transform-origin: 0 100%;
    }

    .t-stamp { position: absolute; top: 20px; right: 22px; width: 88px; height: 88px; }
    .t-stamp text { font-size: 8.5px; font-weight: 600; letter-spacing: .18em; fill: var(--ink); }
    .t-stamp .spin { transform-origin: 50px 50px; }
    .t-stamp .dot { fill: var(--matcha); transform-box: fill-box; transform-origin: center; }
    .t-eyebrow { font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); margin: 0 0 18px; }
    .t-title { font-size: clamp(46px, 10vw, 76px); line-height: .9; letter-spacing: -0.065em; font-weight: 800; margin: 0 0 12px; }
    .t-title .outline { color: transparent; -webkit-text-stroke: 1.4px var(--ink); }
    .t-count { font-size: 13px; color: var(--matcha-deep); letter-spacing: .02em; margin: 0 0 22px; }
    .t-setlist { list-style: none; padding: 0; margin: 0 0 20px; border-top: 1px solid var(--ink); }
    .t-setlist li { display: grid; grid-template-columns: 24px 40px 1fr auto; align-items: baseline; gap: 10px; padding: 9px 0; border-bottom: 1px dashed var(--line); font-size: 14px; }
    .t-setlist .n, .t-setlist .y { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
    .t-setlist .ti { font-weight: 600; letter-spacing: -0.035em; }
    .t-setlist .ti small { font-size: 11px; font-weight: 400; color: var(--muted); margin-left: 6px; letter-spacing: 0; }
    .t-setlist .bpm { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
    .t-setlist .bpm b { font-weight: 600; color: var(--ink); }
    .t-setlist .bpm i { width: 5px; height: 5px; border-radius: 50%; background: var(--matcha); }
    .t-meta { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 0; }
    .t-meta dt, .s-info dt { font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
    .t-meta dd { margin: 0; font-size: 13px; font-weight: 600; }
    .s-admit { font-size: 22px; font-weight: 800; line-height: 1; letter-spacing: -0.02em; text-transform: uppercase; }
    .s-info { margin: 0; }
    .s-info div { display: flex; justify-content: space-between; align-items: baseline; padding: 6px 0; border-top: 1px solid var(--line); }
    .s-info dd { margin: 0; font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums; }
    .s-barcode {
      height: 44px; opacity: .85;
      background: repeating-linear-gradient(90deg, var(--ink) 0 1px, #0000 1px 3px, var(--ink) 3px 5px, #0000 5px 6px,
        var(--ink) 6px 7px, #0000 7px 10px, var(--ink) 10px 13px, #0000 13px 14px);
    }
    .t-actions { display: flex; align-items: center; flex-wrap: wrap; gap: 16px; max-width: 640px; margin: 28px auto 0; }
    .t-hint { margin: 0; font-size: 12px; color: var(--muted); }
    .primary .arr { display: inline-block; transition: transform .3s cubic-bezier(.16, 1, .3, 1); }
    .primary:hover .arr { transform: translateX(4px); }

    @media (max-width: 560px) {
      .ticket { grid-template-columns: 1fr; }
      .ticket-main {
        padding: 24px 22px 20px; border-radius: 18px 18px 0 0;
        --m: radial-gradient(circle var(--notch) at 0 100%, #0000 98%, #000) left / 51% 100% no-repeat,
             radial-gradient(circle var(--notch) at 100% 100%, #0000 98%, #000) right / 51% 100% no-repeat;
      }
      .ticket-stub {
        flex-direction: row; align-items: center; gap: 18px; padding: 18px 22px;
        border-left: 0; border-top: 1.5px dashed #cfc6b4; border-radius: 0 0 18px 18px; transform-origin: 0 0;
        --m: radial-gradient(circle var(--notch) at 0 0, #0000 98%, #000) left / 51% 100% no-repeat,
             radial-gradient(circle var(--notch) at 100% 0, #0000 98%, #000) right / 51% 100% no-repeat;
      }
      .s-admit { font-size: 16px; }
      .s-info { flex: 1; }
      .s-barcode { width: 60px; height: 36px; }
      .t-stamp { top: 14px; right: 14px; width: 70px; height: 70px; }
      .t-setlist li { grid-template-columns: 22px 34px 1fr auto; gap: 8px; }
      .t-setlist .ti small { display: none; }
    }

    /* 등장 효과 (konkuk2026 RevealObserver 방식): 아래에서 떠오르며, 위로 갈수록 투명한 마스크가 걷히듯 올라간다 */
    @property --reveal { syntax: "<percentage>"; inherits: false; initial-value: 100%; }
    @property --write { syntax: "<percentage>"; inherits: false; initial-value: 100%; }
    .motion .ticket-wrap { animation: rise 1.4s cubic-bezier(.16, 1, .3, 1) .1s both; }
    .motion [data-reveal] {
      -webkit-mask-image: linear-gradient(to top, #000 calc(var(--reveal) * 1.6 - 60%), #0000 calc(var(--reveal) * 1.6));
      mask-image: linear-gradient(to top, #000 calc(var(--reveal) * 1.6 - 60%), #0000 calc(var(--reveal) * 1.6));
      animation: reveal 1.1s cubic-bezier(.16, 1, .3, 1) var(--d, 0ms) both;
    }
    /* 붓으로 써 내려가듯 왼쪽에서 오른쪽으로 */
    .motion [data-reveal="write"] {
      -webkit-mask-image: linear-gradient(100deg, #000 calc(var(--write) * 1.3 - 30%), #0000 calc(var(--write) * 1.3));
      mask-image: linear-gradient(100deg, #000 calc(var(--write) * 1.3 - 30%), #0000 calc(var(--write) * 1.3));
      animation: write 1.3s cubic-bezier(.55, .1, .35, 1) var(--d, 0ms) both;
    }
    .motion .t-stamp .spin { animation: spin 24s linear infinite; }
    .motion .t-stamp .dot { animation: beat .652s cubic-bezier(.2, .8, .3, 1) infinite; }
    .motion .t-setlist .bpm i { animation: beat var(--beat, .6s) cubic-bezier(.2, .8, .3, 1) infinite; }
    /* 입장: 꼬리표가 절취선에서 찢겨 떨어지고 본권은 걷힌다 */
    .motion .ticket.torn .ticket-stub { animation: tear .75s cubic-bezier(.55, 0, .7, .2) forwards; }
    .motion .ticket.torn .ticket-main { animation: leave .6s cubic-bezier(.16, 1, .3, 1) .2s forwards; }
    @keyframes rise { from { opacity: 0; transform: translateY(14vh) rotate(-2.5deg); } to { opacity: 1; transform: none; } }
    @keyframes reveal { from { opacity: 0; transform: translateY(1.4rem); --reveal: 0%; } to { opacity: 1; transform: none; --reveal: 100%; } }
    @keyframes write { from { --write: 0%; } to { --write: 100%; } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes beat { 0% { transform: scale(1.8); opacity: 1; } 70%, 100% { transform: scale(1); opacity: .35; } }
    @keyframes tear { 25% { transform: rotate(5deg); } to { transform: translate(70px, 160px) rotate(24deg); opacity: 0; } }
    @keyframes leave { to { transform: translateY(-10px); opacity: 0; } }

    /* 마우스 꼬리선 캔버스 (게임 캔버스 스타일을 덮어쓴다) */
    .trail { position: fixed; inset: 0; width: 100%; max-width: none; height: 100%; background: none; border: 0; border-radius: 0; pointer-events: none; z-index: 50; }

    .primary, .ghost, form button {
      border-radius: 999px; padding: 11px 22px; cursor: pointer; font-weight: 600; font-size: 14px;
      transition: transform .1s ease, background .2s ease;
    }
    .primary { background: var(--ink); color: var(--paper); border: 1px solid var(--ink); }
    .primary:hover { background: var(--matcha-deep); border-color: var(--matcha-deep); }
    .ghost, form button { background: transparent; border: 1px solid var(--ink); }
    .ghost:hover, form button:hover { background: var(--ink); color: var(--paper); }
    button:active { transform: scale(.98); }
    .actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 28px; }

    /* 공통: 큰 제목·외곽선 글씨 */
    .big-title { font-size: clamp(36px, 7vw, 56px); line-height: .98; letter-spacing: -0.06em; font-weight: 800; margin: 0 0 12px; }
    .outline { color: transparent; -webkit-text-stroke: 1.3px var(--ink); }
    .sub { color: var(--muted); font-size: 14px; margin: 0 0 28px; }

    /* setlist: 무대마다 한 장씩 */
    .setlist { list-style: none; padding: 0; margin: 0; display: grid; gap: 10px; }
    .set-row {
      position: relative; width: 100%; display: grid; grid-template-columns: 52px 1fr auto auto; align-items: center; gap: 18px;
      padding: 18px 22px 18px 0; border: 0; text-align: left; cursor: pointer;
      background: var(--paper); border-radius: 14px;
      box-shadow: 0 1px 1px rgba(43, 42, 39, .06), 0 12px 24px -18px rgba(43, 42, 39, .35);
      transition: transform .4s cubic-bezier(.16, 1, .3, 1), box-shadow .4s cubic-bezier(.16, 1, .3, 1);
    }
    .set-row:not(:disabled):hover { transform: translateY(-3px); box-shadow: 0 1px 1px rgba(43, 42, 39, .06), 0 20px 30px -18px rgba(43, 42, 39, .4); }
    .set-row:disabled { cursor: not-allowed; opacity: .45; }
    .set-no { align-self: stretch; display: flex; align-items: center; justify-content: center; border-right: 1.5px dashed #cfc6b4; font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums; }
    .set-body { display: grid; gap: 2px; }
    .set-year { font-size: 11px; color: var(--muted); letter-spacing: .08em; font-variant-numeric: tabular-nums; }
    .set-title { font-size: 18px; font-weight: 700; letter-spacing: -0.04em; }
    .set-title small { font-size: 12px; font-weight: 400; color: var(--muted); margin-left: 8px; letter-spacing: 0; }
    .set-bpm { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
    .set-bpm i { width: 5px; height: 5px; border-radius: 50%; background: var(--matcha); }
    .set-state { display: inline-flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 600; color: var(--muted); letter-spacing: .04em; text-transform: uppercase; min-width: 72px; justify-content: flex-end; }
    .set-state b { color: var(--ink); font-variant-numeric: tabular-nums; letter-spacing: 0; }
    .set-row:not(:disabled):hover .arr { transform: translateX(4px); }
    .set-state .arr { display: inline-block; transition: transform .3s cubic-bezier(.16, 1, .3, 1); color: var(--ink); }
    .stamp {
      display: inline-block; font-style: normal; font-size: 10px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase;
      color: var(--matcha-deep); border: 1.5px solid currentColor; border-radius: 4px; padding: 1px 6px; transform: rotate(-7deg);
    }
    .set-row.encore { background: var(--ink); color: var(--paper); }
    .set-row.encore .set-no { border-color: rgba(251, 248, 242, .25); }
    .set-row.encore .set-year, .set-row.encore .set-title small { color: rgba(251, 248, 242, .6); }
    .set-row.encore .set-state, .set-row.encore .arr { color: var(--paper); }
    @media (max-width: 560px) {
      .set-row { grid-template-columns: 40px 1fr auto; gap: 12px; padding-right: 16px; }
      .set-bpm { display: none; }
      .set-title small { display: none; }
    }

    /* play */
    .hud { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 12px; }
    .hud strong { display: block; font-size: 18px; letter-spacing: -0.035em; }
    .hud-right { text-align: right; font-variant-numeric: tabular-nums; }
    .hud-right span { display: block; }
    #hudScore { font-size: 22px; font-weight: 700; }
    #hudCombo { font-size: 12px; }
    .stage-wrap { position: relative; display: flex; justify-content: center; }
    canvas { width: 100%; max-width: 360px; height: auto; background: var(--paper); border-radius: 18px; border: 1px solid var(--line); touch-action: none; }
    .countdown { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 64px; font-weight: 800; color: var(--matcha-deep); pointer-events: none; }
    .pads { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; max-width: 360px; margin: 12px auto 0; }
    .pads button { padding: 14px 0; border-radius: 14px; border: 1px solid var(--line); background: var(--paper); font-size: 20px; cursor: pointer; touch-action: manipulation; }
    .pads button.hit { background: var(--matcha); color: #fff; border-color: var(--matcha); }
    @media (hover: hover) and (pointer: fine) { .pads { display: none; } }

    /* result: 성적표 티켓 + 도장 */
    .result-card {
      position: relative; padding: 28px 30px 24px; margin-bottom: 28px; background: var(--paper); border-radius: 18px;
      box-shadow: 0 1px 1px rgba(43, 42, 39, .06), 0 18px 32px -20px rgba(43, 42, 39, .4);
    }
    .result-card .big-title { padding-right: 110px; }
    .clear-stamp {
      display: none; position: absolute; top: 26px; right: 26px; padding: 6px 12px;
      font-size: 22px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--matcha-deep);
      border: 3px double currentColor; border-radius: 8px; transform: rotate(-12deg); opacity: .9;
    }
    .result-card.is-clear .clear-stamp { display: block; }
    .motion .result-card.is-clear .clear-stamp { animation: stamp .45s cubic-bezier(.3, 1.5, .5, 1) .55s both; }
    .motion .result-card.is-clear { animation: thud .25s ease-out .75s; }
    @keyframes stamp { from { opacity: 0; transform: rotate(-12deg) scale(2.6); } to { opacity: .9; transform: rotate(-12deg) scale(1); } }
    @keyframes thud { 40% { transform: translateY(3px); } }
    .stats { display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px; margin: 22px 0 0; padding-top: 18px; border-top: 1.5px dashed #cfc6b4; }
    .stats dt { font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
    .stats dd { margin: 2px 0 0; font-size: 18px; font-weight: 700; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
    @media (max-width: 560px) {
      .result-card { padding: 24px 22px 20px; }
      .result-card .big-title { padding-right: 70px; }
      .clear-stamp { top: 20px; right: 16px; font-size: 15px; }
      .stats { grid-template-columns: repeat(3, 1fr); }
    }
    .chapter { border-top: 1px solid var(--ink); padding-top: 20px; }
    .chapter:empty { display: none; }
    .chapter .ch-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
    .chapter .ch-head h3 { font-size: 18px; margin: 0; letter-spacing: -0.04em; }
    .chapter p { margin: 0 0 14px; color: #4d4a44; }
    /* 클리어 화면: 하이라이트 숫자 + 항목 칩 */
    .ch-hl { display: flex; align-items: center; gap: 22px; margin: 4px 0 18px; }
    .ch-hl p { margin: 0; }
    .hl { display: grid; padding-right: 22px; border-right: 1.5px dashed #cfc6b4; }
    .hl-value { font-size: 40px; font-weight: 800; line-height: 1; letter-spacing: -0.05em; white-space: nowrap; color: transparent; -webkit-text-stroke: 1.2px var(--ink); }
    .hl-label { margin-top: 6px; font-size: 11px; color: var(--muted); letter-spacing: .04em; }
    .chips { list-style: none; padding: 0; margin: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); align-items: start; gap: 10px; }
    .chip {
      display: flex; flex-direction: column; gap: 4px; padding: 14px 16px; background: var(--paper); border-radius: 14px;
      box-shadow: 0 1px 1px rgba(43, 42, 39, .06), 0 10px 20px -16px rgba(43, 42, 39, .35);
    }
    .chip strong { font-size: 15px; letter-spacing: -0.035em; }
    .chip-text { font-size: 13px; line-height: 1.5; color: #5d5952; }
    .metric {
      align-self: flex-start; margin-top: 4px; padding: 2px 9px; border-radius: 999px; background: rgba(127, 156, 122, .14);
      font-style: normal; font-size: 11px; font-weight: 600; color: var(--matcha-deep); font-variant-numeric: tabular-nums;
    }
    @media (max-width: 560px) {
      .ch-hl { flex-direction: column; align-items: flex-start; gap: 10px; }
      .hl { padding: 0 0 10px; border-right: 0; border-bottom: 1.5px dashed #cfc6b4; }
    }

    /* 커튼콜 프로그램북 항목: 태그 | 제목·설명 | 수치 */
    .items { list-style: none; padding: 0; margin: 0; }
    .items li { display: grid; grid-template-columns: 88px 1fr auto; align-items: baseline; gap: 0 12px; padding: 8px 0 8px 12px; border-left: 2px solid transparent; border-bottom: 1px dashed var(--line); font-size: 14px; }
    .items li.has-detail { border-left-color: var(--matcha); }
    .items b { font-weight: 600; margin-right: 6px; }
    .items .metric { margin-top: 0; white-space: nowrap; }
    @media (max-width: 560px) {
      .items li { grid-template-columns: 76px 1fr; }
      .items .metric { grid-column: 2; }
    }
    .tag { font-size: 11px; color: var(--matcha-deep); letter-spacing: 0.04em; text-transform: uppercase; padding-top: 2px; }
    .tag.Dance { color: #b77d7a; }
    .tag.Hackathon { color: #9a7b4f; }

    /* curtain: 공연 프로그램북 */
    .cc-headline { font-size: clamp(28px, 5.4vw, 40px); line-height: 1.2; letter-spacing: -0.05em; font-weight: 800; margin: 0 0 14px; }
    .links a { color: var(--matcha-deep); margin-right: 14px; font-size: 13px; }
    .sec-title { font-size: clamp(26px, 5vw, 36px); line-height: 1; letter-spacing: -0.05em; font-weight: 800; margin: 56px 0 20px; }
    .sec-title .outline { -webkit-text-stroke-width: 1.1px; }
    .timeline { margin: 0; border-top: 1px solid var(--ink); }
    .program { display: grid; grid-template-columns: 150px 1fr; gap: 24px; padding: 26px 0; border-bottom: 1px solid var(--line); }
    .program .p-year { font-size: 48px; font-weight: 800; line-height: .9; letter-spacing: -0.06em; color: transparent; -webkit-text-stroke: 1.2px var(--ink); font-variant-numeric: tabular-nums; }
    .program .p-grade { display: block; margin-top: 8px; font-size: 11px; color: var(--muted); letter-spacing: .1em; text-transform: uppercase; }
    .program h4 { margin: 0 0 6px; font-size: 19px; letter-spacing: -0.04em; }
    .program h4 small { font-size: 12px; font-weight: 400; color: var(--muted); margin-left: 8px; letter-spacing: 0; }
    .program p { margin: 0 0 12px; color: #4d4a44; }
    .p-hl { display: block; margin-top: 16px; font-size: 20px; font-weight: 800; letter-spacing: -0.04em; line-height: 1.1; }
    .p-hl small { display: block; margin-top: 2px; font-size: 11px; font-weight: 400; color: var(--muted); letter-spacing: 0; }
    .facts { display: grid; grid-template-columns: 1fr 1fr; gap: 0 24px; margin: 22px 0 0; border-top: 1px solid var(--line); }
    .facts div { display: grid; grid-template-columns: 72px 1fr; align-items: baseline; gap: 10px; padding: 10px 0; border-bottom: 1px dashed var(--line); }
    .facts dt { font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
    .facts dd { margin: 0; font-size: 13px; font-weight: 600; }
    .roadmap { list-style: none; padding: 0; margin: 0; display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
    .roadmap li { padding: 20px; border: 1.5px dashed #cfc6b4; border-radius: 16px; }
    .roadmap .r-year { display: block; font-size: 30px; font-weight: 800; line-height: 1; letter-spacing: -0.05em; color: transparent; -webkit-text-stroke: 1.1px var(--ink); }
    .roadmap h4 { margin: 12px 0 4px; font-size: 16px; letter-spacing: -0.035em; }
    .roadmap p { margin: 0; font-size: 13px; color: #5d5952; }
    .roadmap-note { margin: 14px 0 0; font-size: 12px; color: var(--muted); }
    @media (max-width: 560px) {
      .program { grid-template-columns: 1fr; gap: 10px; }
      .program .p-year { font-size: 40px; }
      .facts, .roadmap { grid-template-columns: 1fr; }
    }
    .board { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .board > section {
      padding: 22px; background: var(--paper); border-radius: 16px;
      box-shadow: 0 1px 1px rgba(43, 42, 39, .06), 0 14px 28px -18px rgba(43, 42, 39, .35);
    }
    .board h3 { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); font-weight: 600; }

    /* 커튼 전환: 벨벳 막이 닫혔다가 양옆으로 걷힌다 */
    .curtains { position: fixed; inset: 0; z-index: 40; display: none; overflow: hidden; }
    .curtains.on { display: block; }
    .curtains > div {
      position: absolute; top: 0; bottom: 0; width: 50.5%;
      background:
        linear-gradient(to bottom, rgba(0, 0, 0, .22), transparent 16%, transparent 78%, rgba(0, 0, 0, .3)),
        repeating-linear-gradient(90deg, #4a2326 0, #6a3236 22px, #7b3d41 31px, #5a2a2d 44px, #4a2326 56px);
    }
    .c-left { left: 0; transform-origin: left center; transform: translateX(-101%); box-shadow: inset -24px 0 36px -18px rgba(0, 0, 0, .45); }
    .c-right { right: 0; transform-origin: right center; transform: translateX(101%); box-shadow: inset 24px 0 36px -18px rgba(0, 0, 0, .45); }
    .c-label {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); opacity: 0;
      font-size: 12px; font-weight: 600; letter-spacing: .4em; text-transform: uppercase; color: #f1e4dc; white-space: nowrap;
    }
    @media (max-width: 600px) { .board { grid-template-columns: 1fr; } }
    input, textarea { width: 100%; background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; font-size: 14px; resize: none; }
    input:focus, textarea:focus { outline: none; border-color: var(--matcha); }
    .inline-form { display: grid; grid-template-columns: 1fr auto; gap: 8px; margin-bottom: 14px; }
    .inline-form .muted { grid-column: 1 / -1; font-size: 12px; }
    .stack-form { display: grid; gap: 8px; margin-bottom: 14px; }
    .stack-form button, .inline-form button { padding: 9px 16px; }
    .ranking { list-style: none; counter-reset: rank; padding: 0; margin: 0; font-size: 14px; font-variant-numeric: tabular-nums; }
    .ranking li { counter-increment: rank; display: flex; align-items: baseline; gap: 12px; padding: 8px 0; border-bottom: 1px dashed var(--line); }
    .ranking li::before { content: counter(rank, decimal-leading-zero); width: 20px; font-size: 11px; color: var(--muted); }
    .ranking li:first-child::before { color: var(--matcha-deep); font-weight: 800; }
    .ranking li.muted::before { content: none; }
    .ranking li span { margin-left: auto; color: var(--muted); }
    .cheers { list-style: none; padding: 0; margin: 0; font-size: 14px; max-height: 320px; overflow-y: auto; }
    .cheers li { padding: 8px 0; border-bottom: 1px dashed var(--line); }
    .cheers b { font-weight: 600; margin-right: 6px; }
    .cheers time { display: block; font-size: 11px; color: var(--muted); }
    .note { font-size: 12px; color: var(--muted); }
    .foot { margin-top: 48px; font-size: 11px; color: var(--muted); text-align: center; }

    /* 설명이 있는 항목: + 표시, 누르면 아래로 말풍선이 펼쳐진다 */
    .has-detail { cursor: pointer; }
    .has-detail:focus-visible { outline: 2px solid var(--matcha); outline-offset: 2px; }
    .has-detail:hover b, .has-detail:hover strong { color: var(--matcha-deep); }
    .plus {
      display: inline-grid; place-items: center; width: 16px; height: 16px; margin-left: 6px; border-radius: 50%;
      background: var(--matcha); color: #fff; font-size: 12px; font-weight: 700; font-style: normal; line-height: 1; vertical-align: 1px;
      transition: transform .35s cubic-bezier(.16, 1, .3, 1), background .2s;
    }
    .has-detail[aria-expanded="true"] .plus { transform: rotate(45deg); background: var(--ink); }
    .chip.has-detail { box-shadow: inset 0 0 0 1.5px rgba(127, 156, 122, .55), 0 10px 20px -16px rgba(43, 42, 39, .35); }
    .bubble { grid-column: 1 / -1; display: grid; grid-template-rows: 0fr; transition: grid-template-rows .45s cubic-bezier(.16, 1, .3, 1); }
    .bubble > div { overflow: hidden; }
    .has-detail[aria-expanded="true"] .bubble { grid-template-rows: 1fr; }
    .bubble-text {
      position: relative; margin: 12px 0 4px; padding: 14px 16px; border-radius: 12px;
      background: var(--ink); color: var(--paper); font-size: 13px; line-height: 1.65; cursor: default;
    }
    .bubble-text::before { content: ""; position: absolute; top: -5px; left: 18px; width: 11px; height: 11px; background: var(--ink); border-radius: 2px; transform: rotate(45deg); }
    .items .bubble-text::before { left: 104px; }
    @media (max-width: 560px) { .items .bubble-text::before { left: 84px; } }
    .motion .items li.ping { animation: ping 1.6s ease .35s; }
    @keyframes ping { 20% { background: rgba(127, 156, 122, .2); } }

    /* Spotlight: 가장 보여주고 싶은 세 가지 */
    .spotlight { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
    .spot {
      width: 100%; height: 100%; display: flex; flex-direction: column; align-items: flex-start; gap: 4px;
      padding: 22px 20px 18px; border: 0; border-radius: 18px; text-align: left; cursor: pointer;
      background: var(--ink); color: var(--paper);
      box-shadow: 0 18px 30px -20px rgba(43, 42, 39, .6);
      transition: transform .4s cubic-bezier(.16, 1, .3, 1), box-shadow .4s cubic-bezier(.16, 1, .3, 1);
    }
    .spot:hover { transform: translateY(-4px); box-shadow: 0 26px 36px -22px rgba(43, 42, 39, .7); }
    .spot-year { font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: rgba(251, 248, 242, .55); }
    .spot-value { margin-top: 14px; font-size: 38px; font-weight: 800; line-height: 1; letter-spacing: -0.05em; white-space: nowrap; color: transparent; -webkit-text-stroke: 1.2px var(--paper); }
    .spot-label { font-size: 11px; color: var(--pink); letter-spacing: .02em; }
    .spot strong { margin-top: 16px; font-size: 17px; letter-spacing: -0.04em; }
    .spot-text { font-size: 13px; line-height: 1.5; color: rgba(251, 248, 242, .75); }
    .spot-more { margin-top: auto; padding-top: 14px; font-size: 12px; font-weight: 600; color: var(--matcha); }
    .spot-more .arr { display: inline-block; transition: transform .3s cubic-bezier(.16, 1, .3, 1); }
    .spot:hover .spot-more .arr { transform: translateX(4px); }
    @media (max-width: 560px) { .spotlight { grid-template-columns: 1fr; } }

    /* 등장 마스크가 호버 시 떠오른 카드의 그림자를 자르지 않도록 감싸는 요소에 여백을 둔다 */
    .setlist > li, .spotlight > div { padding: 8px 0 28px; margin: -8px 0 -28px; }

    /* 댄서: 게임 캔버스 왼쪽에서 춤춘다. 포즈 각도(--al 등)는 game.js가 박자마다 바꾼다 */
    .dancer {
      --al: 20deg; --al2: -10deg; --ar: -20deg; --ar2: 10deg; --ll: 0deg; --lr: 0deg; --tilt: 0deg; --y: 0px; --head: 0deg; --t: .14s;
      position: absolute; bottom: 64px; left: calc(50% - 180px - 150px); width: 130px; pointer-events: none;
    }
    .d-fig { position: relative; transform-origin: 50% 100%; transform: translateY(var(--y)) rotate(var(--tilt)); transition: transform var(--t) cubic-bezier(.3, .7, .4, 1); }
    .d-body { display: block; width: 130px; height: auto; margin-top: 52px; overflow: visible; }
    .d-body line { stroke-linecap: round; }
    .leg line { stroke: var(--ink); stroke-width: 11; }
    .leg ellipse { fill: var(--ink); }
    .arm line, .fore line { stroke: #2f3a52; stroke-width: 9; }
    .arm circle, .fore circle { fill: #f2d6c4; }
    .torso { fill: #2f3a52; }
    .turtle { fill: var(--ink); }
    .leg, .arm, .fore { transition: transform var(--t) cubic-bezier(.3, .7, .4, 1); }
    .leg-l { transform-origin: 53px 104px; transform: rotate(var(--ll)); }
    .leg-r { transform-origin: 67px 104px; transform: rotate(var(--lr)); }
    .arm-l { transform-origin: 40px 58px; transform: rotate(var(--al)); }
    .arm-r { transform-origin: 80px 58px; transform: rotate(var(--ar)); }
    .fore-l { transform-origin: 38px 82px; transform: rotate(var(--al2)); }
    .fore-r { transform-origin: 82px 82px; transform: rotate(var(--ar2)); }
    .d-face {
      position: absolute; top: 0; left: 50%; width: 64px; height: 80px; margin-left: -32px; border-radius: 50%; object-fit: cover;
      box-shadow: 0 2px 6px rgba(43, 42, 39, .18); transform-origin: 50% 90%; transform: rotate(var(--head));
      transition: transform var(--t) cubic-bezier(.3, .7, .4, 1);
    }
    .d-shadow { width: 70px; height: 10px; margin: -6px auto 0; border-radius: 50%; background: rgba(43, 42, 39, .12); }
    .d-pop {
      position: absolute; top: -8px; left: 50%; transform: translateX(-50%); opacity: 0;
      font-size: 12px; font-weight: 800; letter-spacing: .08em; color: var(--matcha-deep); white-space: nowrap;
    }
    .motion .dancer.hop .d-fig { animation: hop .38s cubic-bezier(.3, .7, .4, 1); }
    .motion .dancer.wobble .d-fig { animation: wobble .42s ease; }
    .motion .dancer.pop .d-pop { animation: pop .7s ease-out; }
    @keyframes hop { 40% { transform: translateY(-22px) rotate(var(--tilt)); } }
    @keyframes wobble { 25% { transform: rotate(-9deg); } 60% { transform: rotate(6deg); } }
    @keyframes pop { 15% { opacity: 1; transform: translate(-50%, -6px); } to { opacity: 0; transform: translate(-50%, -26px); } }
    /* 캔버스 옆 공간이 없는 좁은 화면에서는 숨긴다 */
    @media (max-width: 680px) { .dancer { display: none; } }
