# DB tier: Redis (비루트 실행을 지원하는 Red Hat 이미지)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tia-redis
  labels:
    app.kubernetes.io/name: tia-redis
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: tia-roadmap
    app.openshift.io/runtime: redis
spec:
  replicas: 1
  strategy:
    type: Recreate         # RWO PVC는 두 Pod가 동시에 붙을 수 없으므로 기존 Pod를 먼저 내린다
  selector:
    matchLabels:
      app.kubernetes.io/name: tia-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tia-redis
        app.kubernetes.io/component: database
        app.kubernetes.io/part-of: tia-roadmap
    spec:
      containers:
        - name: redis
          image: registry.access.redhat.com/rhel9/redis-7:latest
          # 이미지 기본 스크립트 대신 설정을 명시적으로 지정한다.
          # --appendonly yes : 쓰기마다 AOF 파일에 기록 → 재시작 후에도 데이터 복구
          command:
            - redis-server
            - --port
            - "6379"
            - --dir
            - /var/lib/redis/data
            - --appendonly
            - "yes"
            - --requirepass
            - $(REDIS_PASSWORD)
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tia-redis-secret
                  key: REDIS_PASSWORD
          ports:
            - name: redis
              containerPort: 6379
          # 포트가 열려 있으면 정상으로 본다 (Redis는 기동이 빠르다)
          readinessProbe:
            tcpSocket:
              port: redis
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: redis
            initialDelaySeconds: 15
            periodSeconds: 20
          # 공유 Sandbox 할당량을 넘지 않도록 작게 지정
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: data
              mountPath: /var/lib/redis/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: tia-redis-data
