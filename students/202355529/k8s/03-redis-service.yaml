# 클러스터 내부 전용 Service. Route를 만들지 않으므로 외부에서는 Redis에 접근할 수 없다.
# Web Pod는 DNS 이름 "tia-redis" 로 접속한다.
apiVersion: v1
kind: Service
metadata:
  name: tia-redis
  labels:
    app.kubernetes.io/name: tia-redis
    app.kubernetes.io/part-of: tia-roadmap
spec:
  selector:
    app.kubernetes.io/name: tia-redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
