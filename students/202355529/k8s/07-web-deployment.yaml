# App tier: Python 웹 서버. 코드·화면·데이터는 모두 ConfigMap으로 주입한다 (이미지 빌드 없음).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tia-web
  labels:
    app.kubernetes.io/name: tia-web
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: tia-roadmap
    app.openshift.io/runtime: python
  annotations:
    # OpenShift Topology 화면에 web → redis 연결 화살표를 그려준다
    app.openshift.io/connects-to: '[{"apiVersion":"apps/v1","kind":"Deployment","name":"tia-redis"}]'
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: tia-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tia-web
        app.kubernetes.io/component: frontend
        app.kubernetes.io/part-of: tia-roadmap
    spec:
      containers:
        - name: web
          image: registry.access.redhat.com/ubi9/python-311:latest
          command: ["python3", "/opt/app-root/app/server.py"]
          env:
            - name: PORT
              value: "8080"          # 비루트 사용자는 1024 미만 포트를 쓸 수 없다
            - name: REDIS_HOST
              value: tia-redis       # Redis Service 이름 (클러스터 내부 DNS)
            - name: REDIS_PORT
              value: "6379"
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tia-redis-secret
                  key: REDIS_PASSWORD
            - name: STATIC_DIR
              value: /opt/app-root/web
            - name: PORTFOLIO_FILE
              value: /opt/app-root/data/portfolio.json
          ports:
            - name: http
              containerPort: 8080
          # 프로세스가 살아 있는지 (실패 시 컨테이너 재시작)
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          # Redis까지 연결돼야 트래픽을 받는다 (실패 시 Service 엔드포인트에서 제외, 재시작은 안 함)
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: app
              mountPath: /opt/app-root/app
              readOnly: true
            - name: static
              mountPath: /opt/app-root/web
              readOnly: true
            - name: portfolio
              mountPath: /opt/app-root/data
              readOnly: true
      volumes:
        - name: app
          configMap:
            name: tia-web-app
        - name: static
          configMap:
            name: tia-web-static
        - name: portfolio
          configMap:
            name: tia-portfolio
